name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现步骤和运行环境，避免只写“不能用”。

  - type: dropdown
    id: project
    attributes:
      label: 受影响项目
      options:
        - AINoteBook
        - 仓库基础设施 / 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Chrome 版本 / AINoteBook v0.1.0 / 5174
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
      description: 可拖入截图；控制台错误也请附上。
    validations:
      required: false
