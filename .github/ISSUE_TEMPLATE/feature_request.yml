name: Feature request
description: 提议新功能或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，再给出建议方案；具体实现方式可以留空。

  - type: dropdown
    id: project
    attributes:
      label: 受影响项目
      options:
        - AINoteBook
        - 仓库基础设施 / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不顺手？为什么需要这个功能？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有考虑过其他做法？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考图、类似产品的交互或使用场景。
    validations:
      required: false
