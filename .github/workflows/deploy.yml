name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'AINoteBook/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AINoteBook/package-lock.json

      - name: Build AINoteBook
        working-directory: AINoteBook
        run: |
          npm ci
          npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p .tmp-site/AINoteBook
          cp -R site/. .tmp-site/
          cp -R AINoteBook/dist/. .tmp-site/AINoteBook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
